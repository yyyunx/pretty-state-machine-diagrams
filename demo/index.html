<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pretty State Machine Diagrams · Renderer Preview</title>
<style>
:root{font-family:Inter,"Segoe UI","Noto Sans TC",sans-serif;color:#20252b;background:#f4f6f8}
body{margin:0}header{padding:20px 28px;background:#fff;border-bottom:1px solid #dce1e6}
main{max-width:1200px;margin:24px auto;padding:0 20px;display:grid;grid-template-columns:minmax(280px,420px) 1fr;gap:18px}
section{background:white;border:1px solid #dce1e6;border-radius:12px;padding:16px;min-width:0}
textarea{box-sizing:border-box;width:100%;min-height:230px;font:12px/1.5 ui-monospace,monospace;border:1px solid #c8d0d8;border-radius:8px;padding:10px}
button{border:0;border-radius:8px;background:#20252b;color:white;padding:10px 14px;cursor:pointer;margin:8px 6px 0 0}
#preview{min-height:420px;overflow:auto;border:1px solid #e0e5e9;border-radius:8px;background:white}
#preview svg{display:block;max-width:100%;height:auto}
#error{color:#a12622;white-space:pre-wrap}
@media(max-width:800px){main{grid-template-columns:1fr}}
</style></head>
<body>
<header><h1>Pretty State Machine Diagrams</h1><p>SVG Renderer · Mock JSON Preview</p></header>
<main>
<section><h2>SMD Model JSON</h2><textarea id="model" spellcheck="false"></textarea><h2>Layout JSON</h2><textarea id="layout" spellcheck="false"></textarea>
<button id="render">Render diagram</button><button id="sample">Load basic sample</button><button id="download">Download SVG</button><p id="error" role="alert"></p></section>
<section><h2>Diagram Preview</h2><div id="preview" aria-live="polite"></div></section>
</main>
<script>
const modelInput=document.querySelector("#model"),layoutInput=document.querySelector("#layout"),preview=document.querySelector("#preview"),error=document.querySelector("#error");
let currentSvg="";
function sample(){
 modelInput.value=JSON.stringify({"schemaVersion":"0.1.0-draft","id":"demo","regions":[{"id":"root","vertices":[{"id":"initial","kind":"pseudostate","pseudostateKind":"initial"},{"id":"idle","kind":"state","displayName":"待機"},{"id":"active","kind":"state","displayName":"執行中","behaviors":{"entry":["start()"],"do":["work()"],"exit":["stop()"]}},{"id":"final","kind":"final"}],"transitions":[{"id":"start","sourceId":"initial","targetId":"idle"},{"id":"run","sourceId":"idle","targetId":"active","triggers":["start"],"guard":"ready == true","effect":"begin()"},{"id":"finish","sourceId":"active","targetId":"final","triggers":["done"]}]}]},null,2);
 layoutInput.value=JSON.stringify({"schemaVersion":"0.1.0-draft","modelId":"demo","viewport":{"x":0,"y":0,"width":600,"height":180},"nodes":{"initial":{"bounds":{"x":35,"y":79,"width":12,"height":12}},"idle":{"bounds":{"x":100,"y":65,"width":100,"height":42}},"active":{"bounds":{"x":315,"y":55,"width":150,"height":62}},"final":{"bounds":{"x":535,"y":77,"width":16,"height":16}}},"regions":{"root":{"bounds":{"x":12,"y":12,"width":576,"height":156}}},"edges":{"start":{"points":[{"x":47,"y":85},{"x":100,"y":86}]},"run":{"points":[{"x":200,"y":86},{"x":315,"y":86}],"labelBounds":{"x":205,"y":40,"width":105,"height":30}},"finish":{"points":[{"x":465,"y":86},{"x":535,"y":85}],"labelBounds":{"x":478,"y":60,"width":52,"height":18}}}},null,2);
}
function draw(){
 try{
 const m=JSON.parse(modelInput.value),l=JSON.parse(layoutInput.value);
 if(m.schemaVersion!==l.schemaVersion||m.id!==l.modelId)throw Error("Model / Layout 版本或 modelId 不一致。");
 const vertexIds=[],regionIds=[],edges=[];
 function visit(r){regionIds.push(r.id);r.vertices.forEach(v=>{vertexIds.push(v.id);if(v.kind==="composite")v.regions.forEach(visit)});r.transitions.forEach(e=>edges.push(e.id))}
 m.regions.forEach(visit);
 for(const [key,ids] of [["nodes",vertexIds],["regions",regionIds],["edges",edges]]){const actual=Object.keys(l[key]||{});if(ids.some(id=>!actual.includes(id))||actual.some(id=>!ids.includes(id)))throw Error(key+" 索引與 Model 不一致。")}
 // Browser demo is a lightweight preview adapter. Production SVG output is generated by src/renderer.
 throw Error("瀏覽器內預覽需要先將 JSON 傳給 Python Renderer。請使用 Python CLI/API 產生 SVG；此頁可編輯測試 JSON 並檢查契約。");
 }catch(e){error.textContent=e.message;preview.innerHTML=""}
}
document.querySelector("#render").onclick=draw;
document.querySelector("#sample").onclick=()=>{sample();draw()};
document.querySelector("#download").onclick=()=>{if(!currentSvg)return;const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([currentSvg],{type:"image/svg+xml"}));a.download="state-machine.svg";a.click();URL.revokeObjectURL(a.href)};
sample();draw();
</script></body></html>
