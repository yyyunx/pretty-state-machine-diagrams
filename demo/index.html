<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pretty State Machine Diagrams | Group F 圖例</title>
<style>
  :root {font:16px/1.65 system-ui,sans-serif;color:#192b3e;background:#f3f6fa}
  body {max-width:1200px;margin:0 auto;padding:clamp(16px,4vw,48px)}
  h1 {font-size:clamp(1.8rem,4vw,2.9rem);line-height:1.15;margin:.3em 0}
  a {color:#174b9d}
  .grid {display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,410px),1fr));gap:16px}
  figure {margin:0;border:1px solid #cad6e4;border-radius:12px;background:white;overflow:hidden}
  figure img {display:block;width:100%;height:auto}
  figcaption {padding:12px 16px;border-bottom:1px solid #e1e8f0;font-weight:650}
  nav {margin-top:18px;display:flex;gap:1em;flex-wrap:wrap}
</style>
</head>
<body>
<header>
  <p>NSYSU · Group F</p>
  <h1>Pretty State Machine Diagrams</h1>
  <p>這些 SVG 由 Python 管線預先產生。操作 JSON 編輯器、重新排版和匯出請在本機執行 <code>pretty-smd serve</code>。</p>
</header>
<main>
  <h2>巢狀複合狀態</h2>
  <div class="grid">
    <figure><figcaption>整合基準</figcaption><a href="../benchmarks/baseline/nested.svg"><img alt="整合基準的巢狀圖" src="../benchmarks/baseline/nested.svg"></a></figure>
    <figure><figcaption>拓樸排版與圖層修正</figcaption><a href="../benchmarks/after/nested.svg"><img alt="修正後的巢狀圖" src="../benchmarks/after/nested.svg"></a></figure>
  </div>
  <h2>正交區域與十種偽狀態</h2>
  <div class="grid">
    <figure><figcaption>Fork、Join 與正交區域</figcaption><a href="../benchmarks/after/orthogonal.svg"><img alt="兩個正交區域與同步轉移" src="../benchmarks/after/orthogonal.svg"></a></figure>
    <figure><figcaption>偽狀態及容器邊界點</figcaption><a href="../benchmarks/after/pseudostates.svg"><img alt="各偽狀態及容器邊界點" src="../benchmarks/after/pseudostates.svg"></a></figure>
  </div>
  <nav aria-label="更多成果">
    <a href="../benchmarks/comparison.csv">13 組案例比較</a>
    <a href="../benchmarks/after/synthetic-48.svg">48 個頂點的大型圖</a>
  </nav>
</main>
</body>
</html>
