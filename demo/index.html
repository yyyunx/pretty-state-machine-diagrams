<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pretty State Machine Diagrams · Renderer Demo</title>
<style>
:root{font-family:Inter,"Segoe UI","Noto Sans TC",sans-serif;color:#20252b;background:#f4f6f8}
body{margin:0}header{padding:18px 26px;background:#fff;border-bottom:1px solid #dce1e6}
main{max-width:1280px;margin:22px auto;padding:0 18px;display:grid;grid-template-columns:minmax(280px,420px) 1fr;gap:18px}
section{background:#fff;border:1px solid #dce1e6;border-radius:12px;padding:16px;min-width:0}
textarea{box-sizing:border-box;width:100%;min-height:250px;font:12px/1.5 ui-monospace,monospace;border:1px solid #c8d0d8;border-radius:8px;padding:10px}
button{border:0;border-radius:8px;background:#20252b;color:#fff;padding:10px 14px;cursor:pointer;margin:8px 6px 0 0}
#preview{min-height:430px;overflow:auto;border:1px solid #e0e5e9;border-radius:8px;background:#fff}
#preview svg{display:block;max-width:100%;height:auto}
#error{color:#a12622;white-space:pre-wrap}small{color:#66717c}
@media(max-width:850px){main{grid-template-columns:1fr}}
</style></head>
<body>
<header><h1>Pretty State Machine Diagrams</h1><p>UML State Machine Diagram · SVG Renderer Demo</p></header>
<main>
<section><h2>SMD Model JSON</h2><textarea id="model" spellcheck="false"></textarea><h2>Layout JSON</h2><textarea id="layout" spellcheck="false"></textarea>
<button id="render">Render SVG</button><button id="sample">Load sample</button><button id="download">Download SVG</button><p id="error" role="alert"></p><small>此頁使用純瀏覽器 JavaScript 預覽器；正式 Python API 請參閱 src/renderer/README.md。</small></section>
<section><h2>Diagram Preview</h2><div id="preview" aria-live="polite"></div></section>
</main>
<script>
const $=s=>document.querySelector(s),modelInput=$("#model"),layoutInput=$("#layout"),preview=$("#preview"),error=$("#error");
let currentSvg="";
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;"}[c]));
const box=b=>[+b.x,+b.y,+b.width,+b.height];
function sample(){
 const m={schemaVersion:"0.1.0-draft",id:"demo",regions:[{id:"root",vertices:[
 {id:"initial",kind:"pseudostate",pseudostateKind:"initial"},
 {id:"idle",kind:"state",displayName:"待機"},
 {id:"active",kind:"state",displayName:"執行中",behaviors:{entry:["start()"],do:["work()"],exit:["stop()"],defer:["pause"]}},
 {id:"final",kind:"final"}],transitions:[
 {id:"start",sourceId:"initial",targetId:"idle"},
 {id:"run",sourceId:"idle",targetId:"active",triggers:["start"],guard:"ready == true",effect:"begin()"},
 {id:"finish",sourceId:"active",targetId:"final",triggers:["done"]}]}]};
 const l={schemaVersion:m.schemaVersion,modelId:m.id,viewport:{x:0,y:0,width:650,height:190},nodes:{
 initial:{bounds:{x:35,y:85,width:12,height:12}},idle:{bounds:{x:100,y:70,width:100,height:42}},
 active:{bounds:{x:315,y:52,width:170,height:78}},final:{bounds:{x:560,y:83,width:16,height:16}}},
 regions:{root:{bounds:{x:12,y:12,width:626,height:166}}},
 edges:{start:{points:[{x:47,y:91},{x:100,y:91}]},run:{points:[{x:200,y:91},{x:315,y:91}],labelBounds:{x:205,y:45,width:105,height:30}},
 finish:{points:[{x:485,y:91},{x:560,y:91}],labelBounds:{x:493,y:65,width:60,height:18}}}};
 modelInput.value=JSON.stringify(m,null,2);layoutInput.value=JSON.stringify(l,null,2);
}
function render(){
 error.textContent="";preview.replaceChildren();
 const m=JSON.parse(modelInput.value),l=JSON.parse(layoutInput.value);
 if(m.schemaVersion!=="0.1.0-draft"||l.schemaVersion!==m.schemaVersion||l.modelId!==m.id)throw Error("Model / Layout schemaVersion 或 modelId 不一致。");
 const V=new Map(),R=new Map(),T=new Map(),all=new Set();
 const add=(id,obj,map)=>{if(!id||all.has(id))throw Error("Model 出現缺漏或重複 ID。");all.add(id);map.set(id,obj)};
 function walk(r){add(r.id,r,R);(r.vertices||[]).forEach(v=>{add(v.id,v,V);if(v.kind==="composite")(v.regions||[]).forEach(walk)});(r.transitions||[]).forEach(t=>add(t.id,t,T))}
 (m.regions||[]).forEach(walk);
 for(const t of T.values())if(!V.has(t.sourceId)||!V.has(t.targetId))throw Error("Transition 端點不存在。");
 for(const [key,map] of [["nodes",V],["regions",R],["edges",T]]){const ids=Object.keys(l[key]||{});if(ids.length!==map.size||ids.some(id=>!map.has(id)))throw Error(key+" Layout 索引與 Model 不一致。")}
 const [vx,vy,vw,vh]=box(l.viewport);if(vw<=0||vh<=0)throw Error("Viewport 尺寸無效。");
 let s='<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="'+[vx,vy,vw,vh].join(" ")+'" width="'+vw+'" height="'+vh+'"><defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#303840"/></marker></defs><rect x="0" y="0" width="100%" height="100%" fill="white"/>';
 const rect=(x,y,w,h,rx=0,fill="white",stroke="#20252b",sw=1.5)=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+rx+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'"/>';
 const txt=(x,y,t,size=12,anchor="middle",weight=400)=>'<text x="'+x+'" y="'+y+'" text-anchor="'+anchor+'" font-family="Inter,Segoe UI,Noto Sans TC,sans-serif" font-size="'+size+'" font-weight="'+weight+'" fill="#20252b">'+esc(t)+'</text>';
 // Region separators and labels are geometry/metadata driven by Layout and Model.
 for(const [id,r] of R){const p=l.regions[id];for(const seg of (p.separatorSegments||[]))s+='<line x1="'+seg[0].x+'" y1="'+seg[0].y+'" x2="'+seg[1].x+'" y2="'+seg[1].y+'" stroke="#68727d" stroke-dasharray="6 5"/>';if(r.displayName&&p.labelBounds){const [x,y,w,h]=box(p.labelBounds);s+=rect(x,y,w,h,0,"white","none",0)+txt(x+w/2,y+h*.72,r.displayName,11,"middle",600)}}
 // Transitions are drawn before vertices so endpoints remain visible.
 for(const [id,t] of T){const p=l.edges[id],pts=p.points;if(!Array.isArray(pts)||pts.length<2)throw Error("Transition points 至少需要兩點。");s+='<polyline points="'+pts.map(p=>p.x+","+p.y).join(" ")+'" fill="none" stroke="#303840" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>';
 let label=t.sourceText||[(t.triggers||[]).join(", "),t.guard?"["+t.guard+"]":"",t.effect?"/ "+t.effect:""].filter(Boolean).join(" ");
 if(label){let b=p.labelBounds;if(b){const [x,y,w,h]=box(b);s+=rect(x,y,w,h,3,"white","none",0)+txt(x+w/2,y+h/2+4,label,10.5)}else{const q=pts[Math.floor(pts.length/2)];s+=txt(q.x,q.y-8,label,10.5)}}}
 function vertex(id){const v=V.get(id),p=l.nodes[id],[x,y,w,h]=box(p.bounds),cx=x+w/2,cy=y+h/2,name=v.displayName;
 if(v.kind==="pseudostate"){const k=v.pseudostateKind,r=Math.min(w,h)/2;
 if(k==="initial"||k==="junction")s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="#20252b"/>';
 else if(k==="choice")s+='<path d="M'+cx+' '+y+'L'+(x+w)+' '+cy+'L'+cx+' '+(y+h)+'L'+x+' '+cy+'Z" fill="white" stroke="#20252b" stroke-width="1.5"/>';
 else if(k==="fork"||k==="join")s+=w>=h?rect(x,cy-Math.max(2,h*.12),w,Math.max(4,h*.24),0,"#20252b","#20252b",0):rect(cx-Math.max(2,w*.12),y,Math.max(4,w*.24),h,0,"#20252b","#20252b",0);
 else if(k==="shallowHistory"||k==="deepHistory"||k==="entryPoint"||k==="exitPoint"){s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="white" stroke="#20252b"/>'+txt(cx,cy+4,k==="shallowHistory"?"H":k==="deepHistory"?"H*":k==="entryPoint"?"E":"X",11,"middle",600)}
 else if(k==="terminate")s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="white" stroke="#20252b"/><path d="M'+(x+w*.28)+' '+(y+h*.28)+'L'+(x+w*.72)+' '+(y+h*.72)+'M'+(x+w*.72)+' '+(y+h*.28)+'L'+(x+w*.28)+' '+(y+h*.72)+'" stroke="#20252b" stroke-width="1.8"/>';
 return}
 if(v.kind==="final"){s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(Math.min(w,h)*.48)+'" fill="white" stroke="#20252b"/><circle cx="'+cx+'" cy="'+cy+'" r="'+(Math.min(w,h)*.31)+'" fill="#20252b"/>';return}
 const comp=v.kind==="composite";s+=rect(x,y,w,h,comp?10:9);
 if(name){const b=p.labelBounds;if(b){const [lx,ly,lw,lh]=box(b);s+=txt(lx+lw/2,ly+lh*.72,name,12,"middle",600)}else s+=txt(cx,y+19,name,12,"middle",600)}
 const beh=v.behaviors||{},lines=[];for(const key of ["entry","do","exit","defer","invariant"]){if(beh[key]===undefined)continue;const vals=Array.isArray(beh[key])?beh[key]:[beh[key]];vals.forEach((value,i)=>lines.push((i===0?({entry:"entry / ",do:"do / ",exit:"exit / ",defer:"defer ",invariant:"{ "})[key]:"  ")+value+(key==="invariant"?" }":"")))}
 if(lines.length){const dy=y+(name?28:8);s+='<line x1="'+(x+1)+'" y1="'+dy+'" x2="'+(x+w-1)+'" y2="'+dy+'" stroke="#9aa2aa"/>';lines.forEach((line,i)=>s+=txt(x+8,dy+15+i*13,line,9.5,"start"))}
 if(comp)(v.regions||[]).forEach(region=>region.vertices.forEach(child=>vertex(child.id)));
 }
 (m.regions||[]).forEach(r=>r.vertices.forEach(v=>vertex(v.id)));
 s+="</svg>";currentSvg=s;preview.innerHTML=s;
}
$("#render").onclick=()=>{try{render()}catch(e){error.textContent=e.message;preview.replaceChildren();currentSvg=""}};
$("#sample").onclick=()=>{sample();$("#render").click()};
$("#download").onclick=()=>{if(!currentSvg){error.textContent="請先成功產生 SVG。";return}const a=document.createElement("a"),url=URL.createObjectURL(new Blob([currentSvg],{type:"image/svg+xml"}));a.href=url;a.download="state-machine.svg";a.click();URL.revokeObjectURL(url)};
sample();$("#render").click();
</script></body></html>
