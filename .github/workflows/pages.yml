name: Browser-native Python and Pages
on:
  pull_request:
    branches: [main, 'feature/project-optimization', 'feature/advanced-optimization']
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  browser-site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip wheel --no-deps --wheel-dir build/wheels .
      - run: python -m pip install build/wheels/*.whl
      - run: python scripts/build_browser.py --wheel build/wheels/*.whl --output dist
      - run: npm install --no-save --no-package-lock playwright@1.61.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser_runtime.cjs dist integration-output/browser-runtime
      - uses: actions/upload-artifact@v4
        with:
          name: browser-runtime-evidence
          path: integration-output/browser-runtime/
      - uses: actions/upload-artifact@v4
        with:
          name: install-free-website
          path: dist/
          include-hidden-files: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: browser-site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
      - run: npm install --no-save --no-package-lock playwright@1.61.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser_runtime.cjs dist integration-output/live
        env:
          P57_LIVE: ${{ steps.deployment.outputs.page_url }}
          P57_SMOKE_ONLY: '1'
