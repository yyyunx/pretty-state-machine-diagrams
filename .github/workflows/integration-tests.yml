name: Group F integration tests
on:
  push:
    branches: ['integration/group-f', main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m tests.model.run_end_to_end --output-dir integration-output
      - uses: actions/upload-artifact@v4
        with:
          name: group-f-integration-diagrams
          path: integration-output/
