name: Group F integration tests
on:
  push:
    branches: ['integration/group-f', main]
  pull_request:
    branches: [main, 'feature/project-optimization', 'feature/advanced-optimization']
  workflow_dispatch:
jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip wheel --no-deps --wheel-dir integration-output/wheels .
      - run: python -m pip install integration-output/wheels/*.whl
      - run: python -m unittest discover -s tests -v
      - run: python -m tests.model.run_end_to_end --output-dir integration-output/suite
      - run: |
          cd integration-output
          pretty-smd generate ../examples/basic.smd.json --output cli.svg --smd-output cli.smd.json --layout-output cli.layout.json --quality-output cli.quality.json
          pretty-smd validate cli.smd.json
      - uses: actions/upload-artifact@v4
        with:
          name: group-f-integration-python-${{ matrix.python }}
          path: integration-output/
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install .
      - run: npm install --no-save --no-package-lock playwright@1.61.1
      - run: npx playwright install --with-deps chromium
      - run: python scripts/build_gallery.py --output dist
      - run: node tests/browser_smoke.cjs
        env:
          PRETTY_SMD_GALLERY: dist
      - uses: actions/upload-artifact@v4
        with:
          name: group-f-browser-diagrams
          path: integration-output/browser/
  package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - shell: bash
        run: |
          wheels=(dist/*.whl)
          python -m pip install "${wheels[0]}"
          mkdir package-test
          cd package-test
          pretty-smd generate ../examples/basic.smd.json --algorithm advanced --mode fast --output smoke.svg
          python -c "from importlib.resources import files; import pretty_smd; assert pretty_smd.__version__ == '0.3.0'; assert files('pretty_smd').joinpath('static', 'index.html').is_file()"
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-wheel-${{ matrix.os }}
          path: dist/*.whl
