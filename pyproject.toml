[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pretty-smd"
version = "0.3.0"
description = "Topology-aware UML state machine diagrams for NSYSU Group F"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jsonschema==4.23.0"]

[project.scripts]
pretty-smd = "pretty_smd.cli:main"

[tool.setuptools.packages.find]
include = ["pretty_smd*", "src", "src.*", "schemas"]

[tool.setuptools.package-data]
schemas = ["*.json"]
pretty_smd = ["data/*.json", "static/*.html", "static/*.css", "static/*.js"]
