<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pretty State Machine Diagrams | Group F</title>
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<header class="banner">
  <div><p class="course">NSYSU · Group F</p><h1>Pretty State Machine Diagrams</h1></div>
  <button id="theme" type="button" aria-pressed="false">深色模式</button>
</header>
<main class="workspace">
  <section class="editor panel" aria-labelledby="input-title">
    <h2 id="input-title">輸入與排版</h2>
    <label for="example">內建案例</label>
    <select id="example"><option value="">選擇案例</option></select>
    <div class="paired">
      <div><label for="format">輸入格式</label><select id="format">
        <option value="auto">自動判斷 JSON</option><option value="smd">SMD JSON</option>
        <option value="mock">Mock Converter JSON</option><option value="pa">原始 Process Algebra</option>
      </select></div>
      <div><label for="file">上傳 JSON</label><input id="file" type="file" accept=".json,application/json"></div>
    </div>
    <p id="pa-note" class="notice" hidden>原始 Process Algebra 需要確認後的 R、S 組 Converter。目前可使用 SMD 或已解析的 Mock JSON。</p>
    <label for="source">JSON 編輯器</label>
    <textarea id="source" spellcheck="false" autocomplete="off" placeholder="貼上 SMD 或已解析的 Mock Converter JSON"></textarea>
    <div class="paired">
      <div><label for="algorithm">排版引擎</label><select id="algorithm">
        <option value="topology">拓樸分層</option><option value="legacy">原始基準</option>
      </select></div>
      <div><label for="direction">方向</label><select id="direction">
        <option value="horizontal">水平</option><option value="vertical">垂直</option>
      </select></div>
    </div>
    <details id="settings"><summary>排版參數</summary>
      <div class="parameters">
        <label>節點間距<input data-option="node_spacing" type="number" min="4" max="500" value="48"></label>
        <label>分層間距<input data-option="layer_spacing" type="number" min="4" max="500" value="64"></label>
        <label>區域邊距<input data-option="region_padding" type="number" min="4" max="500" value="24"></label>
        <label>連線淨距<input data-option="edge_clearance" type="number" min="4" max="500" value="8"></label>
        <label>交叉成本<input data-option="crossing_penalty" type="number" min="0" max="500" value="85"></label>
        <label>轉折成本<input data-option="bend_penalty" type="number" min="0" max="500" value="22"></label>
        <label>標籤淨距<input data-option="label_clearance" type="number" min="4" max="500" value="8"></label>
      </div>
    </details>
    <button id="generate" class="primary" type="button">生成狀態機圖</button>
    <p id="status" role="status" aria-live="polite"></p>
    <details id="diagnostics"><summary>驗證與診斷</summary><ul id="diagnostic-list"></ul></details>
  </section>
  <section class="viewer panel" id="viewer" aria-labelledby="preview-title">
    <div class="viewer-head"><h2 id="preview-title">圖形預覽</h2>
      <div class="actions" aria-label="預覽操作">
        <button id="zoom-out" type="button" aria-label="縮小">−</button><button id="zoom-in" type="button" aria-label="放大">+</button>
        <button id="fit" type="button">適合畫面</button><button id="reset" type="button">重設</button>
        <button id="fullscreen" type="button">全螢幕</button>
      </div>
    </div>
    <div id="canvas" class="canvas" aria-label="可拖曳及縮放的狀態機圖">
      <p id="empty">選擇案例或貼上 JSON，然後生成狀態機圖。</p>
      <div id="drawing"></div>
    </div>
    <div class="viewer-bottom">
      <div class="actions"><label for="export">匯出</label><select id="export">
        <option value="svg">SVG</option><option value="model">SMD JSON</option>
        <option value="layout">Layout JSON</option><option value="quality">品質報告 JSON</option>
      </select><button id="download" type="button" disabled>下載</button></div>
      <p id="time"></p>
    </div>
    <details id="quality"><summary>排版品質</summary><dl id="quality-list"></dl></details>
    <details id="inspector"><summary>選取的圖元</summary><pre id="item">點選狀態或轉移查看資料。</pre></details>
  </section>
</main>
</body>
</html>
